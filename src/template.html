<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TODO List</title>
    </head>

    <body>
        <div class="main">
            <div class="header">
                <button class="addTaskBtn" command="show-modal" commandfor="my-dialog">Add task</button>
            </div>

            <div class="taskList">
                List
            </div>

            <div class="taskDisplay">
                Display
            </div>

            <dialog id="my-dialog">
                <form action="get" class="taskForm">
                    <div class="formTitle">
                        <label for="taskTitle">Enter title: </label>
                        <input type="text" name="taskTitle" id="taskTitle" required>
                    </div>
                    <div class="formDescription">
                        <label for="taskDescription">Enter description: </label>
                        <input type="text" name="taskDescription" id="taskDescription" required>
                    </div>
                    <div class="formDueDate">
                        <label for="taskDueDate">Enter due date: </label>
                        <input type="text" name="taskDueDate" id="taskDueDate" required>
                    </div>
                </form>

                <button commandfor="my-dialog" command="close">Submit Task</button>
                <button commandfor="my-dialog" command="close">Close</button>
            </dialog>
        </div>
    </body>
</html>

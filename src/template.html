<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TODO List</title>
    </head>

    <body>
        <div class="main">
            <div class="header">
                <button class="homeBtn">Home</button>
                <h1>TODO List</h1>
                <button class="addTaskBtn" command="show-modal" commandfor="my-dialog">Add task</button>
            </div>

            <div class="taskList">
                <h2>Recent</h2>
                <div class="recents"></div>
            </div>

            <div class="tasksDisplay">

            </div>

            <dialog id="my-dialog">
                <form action="get" id="taskForm">
                    <div class="formTitle">
                        <label for="taskTitle">Enter title: </label>
                        <input type="text" name="taskTitle" id="taskTitle" maxlength="15" required>
                    </div>
                    <div class="formDescription">
                        <label for="taskDescription">Enter description: </label>
                        <input type="text" name="taskDescription" id="taskDescription" required>
                    </div>
                    <div class="formDueDate">
                        <label for="taskDueDate">Enter due date: </label>
                        <input type="date" name="taskDueDate" id="taskDueDate" required>
                    </div>
                    <div class="formPriority">
                        <label for="taskPriority">Enter priority (1 to 3)</label>
                        <input type="number" name="taskPriority" id="taskPriority" min="1" max="3" required>
                    </div>

                    <button type="submit">Submit tasks</button>
                </form>

                <button class="closeDialog" commandfor="my-dialog" command="close">Close</button>
            </dialog>

            <dialog id="checklist-dialog">
                <form action="get" id="checklistForm">
                    <div class="formText">
                        <label for="checklistText">Enter text: </label>
                        <input type="text" name="checklistText" id="checklistText" required>
                    </div>

                    <button type="submit">Submit</button>
                </form>

                <button class="closeDialog" commandfor="checklist-dialog" command="close">Close</button>
            </dialog>
        </div>
    </body>
</html>
